<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#b06cff"/>
    </linearGradient>
    <linearGradient id="bgg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16161f"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- soft bloom behind the bars -->
  <g filter="url(#soft)" opacity="0.55">
    <g fill="url(#g)">
      <rect x="148" y="422" width="68" height="180" rx="34"/>
      <rect x="258" y="342" width="68" height="340" rx="34"/>
      <rect x="368" y="232" width="68" height="560" rx="34"/>
      <rect x="478" y="152" width="68" height="720" rx="34"/>
      <rect x="588" y="262" width="68" height="500" rx="34"/>
      <rect x="698" y="362" width="68" height="300" rx="34"/>
      <rect x="808" y="412" width="68" height="200" rx="34"/>
    </g>
  </g>

  <!-- waveform -->
  <g fill="url(#g)">
    <rect x="148" y="422" width="68" height="180" rx="34"/>
    <rect x="258" y="342" width="68" height="340" rx="34"/>
    <rect x="368" y="232" width="68" height="560" rx="34"/>
    <rect x="478" y="152" width="68" height="720" rx="34"/>
    <rect x="588" y="262" width="68" height="500" rx="34"/>
    <rect x="698" y="362" width="68" height="300" rx="34"/>
    <rect x="808" y="412" width="68" height="200" rx="34"/>
  </g>

  <!-- generate spark -->
  <g transform="translate(824,214)" fill="#ffffff">
    <path d="M0,-62 C10,-22 22,-10 62,0 C22,10 10,22 0,62 C-10,22 -22,10 -62,0 C-22,-10 -10,-22 0,-62 Z"/>
  </g>
</svg>
